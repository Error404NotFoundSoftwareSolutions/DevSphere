[project]
name = "devsphere-content-ci"
version = "0.0.0"
description = "labcheck: validate labs before publishing"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "pyyaml>=6"]

[project.scripts]
labcheck = "labcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labcheck"]
