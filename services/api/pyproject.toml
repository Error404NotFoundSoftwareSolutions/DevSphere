[project]
name = "devsphere-api"
version = "0.0.0"
description = "Cloud API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "google-genai>=3.0.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-secret-manager>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
