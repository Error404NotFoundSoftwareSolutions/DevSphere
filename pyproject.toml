[project]
name = "devsphere-workspace"
version = "0.0.0"
description = "uv workspace root for the DevSphere Python services"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "services/grader", "services/content-ci"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures/hostile", "tools/gen_rtm.py", "tools/make_backlog.py", "tools/gen_test_plan.py", "tools/check_sad.py", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]   # B008: FastAPI Depends() in defaults is the normal pattern

[tool.pytest.ini_options]
testpaths = ["services", "tools/tests"]
addopts = "-q"
