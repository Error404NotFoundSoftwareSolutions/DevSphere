name: devsphere
packages:
  - apps/*
  - packages/*
  - services/local-worker

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    exec: dart analyze .
    description: Run dart analyze in all packages

  test:
    run: melos run test:dart && melos run test:flutter
    description: Run all unit and widget tests

  test:dart:
    exec: dart test
    packageFilters:
      flutter: false
      dirExists: test

  test:flutter:
    exec: flutter test
    packageFilters:
      flutter: true
      dirExists: test

  check:
    run: melos run analyze && melos run test
    description: Run analyze and test across the workspace

