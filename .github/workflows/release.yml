name: release
on:
  push: { tags: ["v*"] }

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: apps/desktop/build/windows/x64/runner/Release
          - os: ubuntu-latest
            target: linux
            artifact: apps/desktop/build/linux/x64/release/bundle
          - os: macos-latest
            target: macos
            artifact: apps/desktop/build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - name: Build Flutter Desktop
        working-directory: apps/desktop
        run: flutter build ${{ matrix.target }} --release
        env:
          # Signing secrets live in the CI secret store only. See docs/RELEASE_CHECKLIST.md.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifact }}
