# User story: US-14 Work on Windows and a second OS (Sprint 3, MVP)
# Requirements: NFR-PORT-001..003, NFR-PORT-005
# Implemented here: installers: Windows (NSIS), Linux (AppImage, deb), macOS (dmg, R3). Signing keys come from CI secrets only

appId: com.devsphere.app
productName: DevSphere
directories: { output: release }
files: ["out/**"]
asarUnpack: ["**/node-pty/**", "**/better-sqlite3/**"] # native modules cannot live inside asar
win: { target: [nsis] }
linux: { target: [AppImage, deb], category: Education }
mac: { target: [dmg], category: public.app-category.education } # needs signing + notarisation (R3)
publish: { provider: generic, url: "https://updates.example.invalid/devsphere" } # replace; updates must be signed (NFR-SEC-010)
