  - { id: CAP-AGENT,             track: D, status: planned, owner: "extensions/devsphere-agent",           uses: [EP-PROVIDER, EP-AGENT-TOOL, EP-APPROVAL-POLICY, EP-EVENT-SINK], note: "Pair and Agent modes" }
  - { id: CAP-SKILL-GRAPH,       track: E, status: planned, owner: "content/skills + services/content-ci", uses: [EP-LAB-KIND, EP-SKILL-PACK], note: "Skills, prerequisites, packs" }
  - { id: CAP-ROADMAP,           track: E, status: planned, owner: "services/api + content",              uses: [EP-ROADMAP-SOURCE, EP-PROVIDER], note: "Prebuilt and generated roadmaps" }
