  - { id: CAP-CONTRIB-SANDBOX,   track: E, status: planned, owner: "content/repos + services/api",         uses: [EP-LAB-KIND, EP-CHECKER],    note: "Prebuilt practice repo with seeded issues and PR flow" }
  - { id: CAP-PR-REVIEW-SIM,     track: E, status: planned, owner: "services/api",                         uses: [EP-REVIEWER, EP-PROVIDER],   note: "AI maintainer reviewer, advisory" }
  - { id: CAP-PROFILES,          track: X, status: planned, owner: "registry/profiles.yaml",               uses: [EP-PROFILE],                 note: "beginner / professional / exam" }
