# Capability registry. Every user-visible feature has one row (ARC-06).
# status: planned | alpha | beta | stable | frozen | dropped
# Rows for Track A reflect the current repo; B/C/D rows are Proposed and must not be built until Active.
version: 1
capabilities:
  - { id: CAP-LAB-RUNNER,        track: A, status: alpha,   owner: "apps/desktop + services/local-worker", uses: [EP-IPC-CHANNEL, EP-LAB-KIND], note: "Guided labs, workspace, practice checks" }
  - { id: CAP-VERIFIED-GRADING,  track: A, status: alpha,   owner: "services/grader + services/api",       uses: [EP-API-ROUTE, EP-CHECKER],   note: "Server-side signed scoring" }
  - { id: CAP-TUTOR,             track: A, status: alpha,   owner: "services/api (proxy) + apps/desktop",  uses: [EP-PROVIDER],                note: "Advisory tutor with visible context controls" }
  - { id: CAP-CONTENT-CI,        track: A, status: alpha,   owner: "services/content-ci",                  uses: [EP-LAB-KIND],                note: "Lab validation and publication" }
  - { id: CAP-REDACTION,         track: A, status: alpha,   owner: "packages/redaction",                   uses: [],                           note: "Secret redaction before logs and AI requests" }
  - { id: CAP-IDE-SHELL,         track: B, status: planned, owner: "devsphere-ide",                        uses: [EP-WORKBENCH-VIEW, EP-EXTENSION-GALLERY], note: "Branded Code-OSS build" }
  - { id: CAP-IDE-LEARN,         track: B, status: planned, owner: "extensions/devsphere-learn",           uses: [EP-WORKBENCH-VIEW, EP-LAB-KIND], note: "Labs inside the IDE" }
  - { id: CAP-BROWSER-PREVIEW,   track: C, status: planned, owner: "devsphere-ide",                        uses: [EP-WORKBENCH-VIEW, EP-BROWSER-CAPABILITY], note: "Preview/reader pane" }
