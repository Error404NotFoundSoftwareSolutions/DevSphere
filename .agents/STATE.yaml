# Live state of the agent kit. Agents READ this first, every session.
# Only a human (or an agent with the human's explicit instruction in chat) may change `code_freeze`.
# Keep this file short and boring. Narrative belongs in sessions/ and memory/.

kit_version: 1.0.0
updated: 2026-11-04

# While true, agents may create or edit ONLY: *.md, *.yaml/*.yml under .agent/, docs/, and plans.
# No source code, no tests, no dependency or lockfile changes, no CI changes, no generated files.
code_freeze: true
code_freeze_reason: >
  Owner asked for the planning, rules and documentation layer first. Implementation starts
  only after the blocking questions in QUESTIONS.md are answered and this flag is set to false.

# Autonomy level (see INTERACTION_PROTOCOL.md). L0 ask before every action, L1 propose then act,
# L2 act then report, L3 run a whole plan unattended.
autonomy:
  docs_and_plans: L2
  code: L1
  anything_outward_facing: L0   # push, PR, publish, message, spend money, install

# Which tracks exist and how far each has been agreed. Agents never build a track that is not Active.
# Status: Proposed -> Accepted (ADR merged) -> Active (in current sprint) -> Frozen | Dropped
tracks:
  A-learning-platform:   { status: Accepted, adr: ADR-003, note: "Flutter desktop + Python services. Exists today." }
  B-devsphere-ide:       { status: Accepted, adr: ADR-013, note: "Branded Code-OSS patch-set in separate repo devsphere-ide. Next: spikes SP-IDE-01..03." }
  C-integrated-browser:  { status: Accepted, adr: ADR-014, note: "Preview, reader, AI-operable, general browsing as capability. Depends on B." }
  D-agent-runtime:       { status: Accepted, adr: ADR-015, note: "Tutor/Pair/Agent by profile. Provider choice Q-013 open." }
  E-curriculum-roadmap:  { status: Proposed, adr: ADR-017, note: "Skill graph, prebuilt+generated roadmaps, OSS contribution sandbox, beginner->professional. Questions answered; awaiting owner's yes on ADR-017 and the MVP change request." }
  X-extension-fabric:    { status: Accepted, adr: ADR-016, note: "Ports/adapters/registries so any later idea plugs in." }

# Answered 2026-11-04: Q-001 (IDE hosts learning platform), Q-002 (patch-set on pinned tag), Q-003, Q-005 (Tutor+Pair+Agent by profile), Q-004, Q-006, Q-007, Q-015.
# ADR-013/014/015 accepted 2026-11-04. Accepted is not Active: no track is built while code_freeze is true.
blocking_questions: []   # remaining open (non-blocking): Q-009..Q-014, Q-016..Q-018   # see QUESTIONS.md
active_plan: .agent/plans/00-master-plan.md
