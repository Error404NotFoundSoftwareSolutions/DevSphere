# Live state of the agent kit. Agents READ this first, every session.
# Only a human (or an agent with the human's explicit instruction in chat) may change `code_freeze`.
# Keep this file short and boring. Narrative belongs in sessions/ and memory/.

kit_version: 1.0.0
updated: 2026-11-04

# While true, agents may create or edit ONLY: *.md, *.yaml/*.yml under .agents/, docs/, and plans.
# No source code, no tests, no dependency or lockfile changes, no CI changes, no generated files.
code_freeze: false
# Owner lifted the freeze on 2026-11-04 for ONE slice only (walking skeleton of the learning flow). Agents may
# create or edit files ONLY inside `active_scope`; anything else still needs a fresh owner yes.
active_scope:
  - extensions/devsphere-learn/
  - apps/desktop/
  - services/local-worker/lib/src/companion/
  - services/local-worker/test/companion_*
  - services/local-worker/pubspec.yaml
  - fixtures/protocol/
  - docs/EXTENSION_PROTOCOL.md
  - packages/ui/
  - docs/DESIGN_SYSTEM.md
  - tools/check_security.py
  - tools/tests/
  - docs/security/
  - docs/buildathon/
  - docs/SECURITY.md
  - SECURITY.md
  - docs/TECH_STACK.md
  - .agents/
  - .gitignore
  - .github/workflows/ci.yml   # only to add the security, extension and lab jobs
  - content/labs/oss-first-contribution-001/   # owner asked for the open-source lab (2026-11-09)
  - services/content-ci/
  - services/api/   # AI gateway and API features (owner asked to build features, 2026-11-11)
  - docs/FEATURE_ROADMAP.md
  - docs/PROGRESS.md
code_freeze_reason_old: >
  Owner asked for the planning, rules and documentation layer first. Implementation starts
  only after the blocking questions in QUESTIONS.md are answered and this flag is set to false.

# Autonomy level (see INTERACTION_PROTOCOL.md). L0 ask before every action, L1 propose then act,
# L2 act then report, L3 run a whole plan unattended.
autonomy:
  docs_and_plans: L2
  code: L1
  anything_outward_facing: L0   # push, PR, publish, message, spend money, install

# Which tracks exist and how far each has been agreed. Agents never build a track that is not Active.
# Status: Proposed -> Accepted (ADR merged) -> Active (in current sprint) -> Frozen | Dropped
tracks:
  A-learning-platform:   { status: Active, adr: ADR-003, note: "Flutter desktop + Python services. Exists today." }
  B-companion-extension: { status: Active, adr: ADR-022, note: "DevPilot app + guide extension in the learner's VS Code. Supersedes the fork (ADR-018)." }
  C-integrated-browser:  { status: Deferred, adr: ADR-019, note: "Re-plan on the companion model; VS Code has a Simple Browser." }
  D-agent-runtime:       { status: Deferred, adr: ADR-020, note: "Tutor first via the extension panel; Pair/Agent later." }
  E-curriculum-roadmap:  { status: Proposed, adr: ADR-017, note: "Skill graph, prebuilt+generated roadmaps, OSS contribution sandbox, beginner->professional. Questions answered; awaiting owner's yes on ADR-017 and the MVP change request." }
  X-extension-fabric:    { status: Accepted, adr: ADR-016, note: "Ports/adapters/registries so any later idea plugs in." }

# Answered 2026-11-04: Q-001 (IDE hosts learning platform), Q-002 (patch-set on pinned tag), Q-003, Q-005 (Tutor+Pair+Agent by profile), Q-004, Q-006, Q-007, Q-015.
# ADR-018/014/015 accepted 2026-11-04. Accepted is not Active: no track is built while code_freeze is true.
blocking_questions: []   # remaining open (non-blocking): Q-009..Q-014, Q-016..Q-018   # see QUESTIONS.md
active_plan: .agents/plans/00-master-plan.md
active_slice: "Companion extension: docs done; next M1 launcher + installer + channel (plans/70-companion-extension-plan.md)"
